<!-- index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Schedule demo</title>
</head>
<body>
  <h3>Schedule demo — save and remove</h3>

  <div>
    <label>Person: <input id="person" value="Frank"></label><br>
    <label>ScopeKey: <input id="scopeKey" value="2026::Spring::2026-03-02"></label><br>
    <label>Day: <input id="day" value="Mon"></label><br>
    <label>Time: <input id="time" value="09:00–10:00"></label><br>
    <label>Count: <input id="count" type="number" value="2"></label><br>
    <button id="saveBtn">Save slot</button>
    <button id="removeBtn">Remove slot</button>
  </div>

  <pre id="out"></pre>

  <script>
    const api = '/api/exec'; // Vercel proxy
    const out = document.getElementById('out');

    async function postAction(action, body) {
      const res = await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ action }, body))
      });
      const j = await res.json();
      out.textContent = JSON.stringify(j, null, 2);
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      const payload = {
        scopeKey: document.getElementById('scopeKey').value,
        day: document.getElementById('day').value,
        time: document.getElementById('time').value,
        person: document.getElementById('person').value,
        participantScheduled: true,
        participantCount: Number(document.getElementById('count').value),
        updatedAtISO: new Date().toISOString(),
        updatedBy: 'demo-ui'
      };
      postAction('saveSlot', payload);
    });

    document.getElementById('removeBtn').addEventListener('click', () => {
      const payload = {
        scopeKey: document.getElementById('scopeKey').value,
        day: document.getElementById('day').value,
        time: document.getElementById('time').value
      };
      postAction('removeSlot', payload);
    });
  </script>
</body>
</html>
